name = "beilinson-stacks-probe"
version = "0.1.0"
defaultTargets = ["StacksProbe"]

# Upstream was checked at this exact Git commit (2026-11-07).
# Its own lakefile.toml uses mathlib v4.35.0.
[[require]]
name = "Stacks"
git = "https://github.com/AxiomMath/Stacks"
rev = "5ed82d14634e8d9576bb844c7bd4e3da66d450e7"

# Reuse the checked algebraic library; the production project does not depend on Stacks.
[[require]]
name = "beilinson-lean"
path = "../.."

[[lean_lib]]
name = "StacksProbe"

# Explicitly requested geometric probe; not part of defaultTargets.
[[lean_lib]]
name = "StacksGeometryProbe"

# Larger closure; run explicitly after the two smaller probes.
[[lean_lib]]
name = "StacksCohomologyProbe"

# Koszul descent, without the much larger dg Morita closure.
[[lean_lib]]
name = "StacksGenerationProbe"

# Large unbounded dg equivalence audit, never a default target.
[[lean_lib]]
name = "StacksBeilinsonProbe"

# Noncommutative ordinary right-module comparison.
[[lean_lib]]
name = "StacksOrdinaryProbe"

# Finite total cohomology on the polynomial-matrix algebra.
[[lean_lib]]
name = "StacksAlgebraProbe"

# A strict dg adapter from the ordinary endomorphism algebra.
[[lean_lib]]
name = "DGAComparison"

# Match the cone convention of the geometric dg equivalence.
[[lean_lib]]
name = "DegreeZeroConeComparison"

# Transport a concentrated dg algebra to ordinary right modules without dg Morita.
[[lean_lib]]
name = "ConcentratedDGA"

# Geometric compactness versus bounded coherent cohomology.
[[lean_lib]]
name = "GeometricPerfectProbe"

# Field-valued polynomial projective space, including n = 0.
[[lean_lib]]
name = "ProjectivePerfectProbe"

# Ordinary-module geometric equivalence; validate after the large upstream closure.
[[lean_lib]]
name = "OrdinaryBeilinson"

# Restriction to compact source and bounded coherent target objects.
[[lean_lib]]
name = "BoundedBeilinson"

# Apply the production finite-projective reconstruction to the Stacks compactness predicate.
[[lean_lib]]
name = "KroneckerCompact"

# Base-linear Hom from the structure sheaf and the scalar-structure comparison.
[[lean_lib]]
name = "SheafHomSections"

# Actual geometric End(O + O(1)) on the projective line.
[[lean_lib]]
name = "ProjectiveLineEnd"

# Compare D^b(Coh) with bounded coherent cohomology in the geometric derived model.
[[lean_lib]]
name = "CoherentDerivedComparison"

# Identify the actual bounded derived category of finite-dimensional Kronecker modules.
[[lean_lib]]
name = "KroneckerBoundedDerived"

# The negative-window generator has the checked Kronecker endomorphism algebra.
[[lean_lib]]
name = "ProjectiveLineWindow"

# End-to-end bounded equivalence for the actual projective line.
[[lean_lib]]
name = "ProjectiveLineBeilinson"

# Canonical twisting and reindexing between the negative and positive windows.
[[lean_lib]]
name = "PositiveWindow"
